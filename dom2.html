<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indirect Selector</title>
<style>
    #answer1 {
        background-color: red;
    }
    #answer2 {
        background-color: blue;
    }
    #answer3 {
        background-color: yellow;
    }
</style>
</head>
<body id="body">
    <div id = "gnb">
        <ul id="ul1">
            <li class ="first" id="li1">1</li>
            <li id="li2">2</li>
            <li id="li3">3</li>
        </ul>


    </div>
    <script>
        const gnb = document.getElementById("gnb");
        document.write(gnb.parentNode.id+ ":");
        document.write(gnb.children[0].id+ ":");
        document.write(gnb.children[0].firstChild.id+":"); // ? Text Node ?
        document.write(gnb.children[0].children[0].id+":");
        document.write(gnb.children[0].children[0].nextElementSibling.id+":");
        document.write(gnb.children[0].children[0].nextElementSibling.nextElementSibling.id+":");
        document.write(gnb.children[0].lastElementChild.id+":");
        document.write(gnb.children[0].firstElementChild.id+":");
    </script>
    <h1>월요일</h1>
    <h2>화요일</h2>
    <script>
        document.body.style['fontSize'] = "10px";
        document.body.style['color'] = "black";
    </script>

    //Inner HTML/innerText/textContent
    <div class="wrap">
        This is fruit <br>
        <span>Banana</span>
        <span>Apple</span>
        Fruit is delicious <br>
    </div>
    <br>
    <div id="answer1"></div><br>
    <div id="answer2"></div><br>
    <div id="answer3"></div>
    <script>
        document.getElementById("answer1").innerText=document.querySelector(".wrap").textContent;
        document.getElementById("answer2").innerHTML=document.querySelector(".wrap").innerText;
        document.getElementById("answer3").innerText=document.querySelector(".wrap").innerHTML;

    </script>

    <h1 id="title">mouse out</h1>
    <a href="#" id="btn"><img src="img/orange.jpg" alt="버튼" width="200" height="100"></a>
    <p id ="img_src">Image Source </p>
    <script>
        const theBtn = document.getElementById("btn");
        const s=document.getElementById("img_src");
        theBtn.onmouseover=function() {
            document.getElementById("title").innerHTML="마우스 오버";
            theBtn.firstChild.src="img/apple.jpg";
            s.innerHTML=theBtn.firstChild.src;
        }
        theBtn.onmouseout=function(){
          document.getElementById("title").innerHTML="마우스 아웃";
          theBtn.firstChild.src="img/banana.jpg";
          s.innerHTML=theBtn.firstChild.src;
        }
    </script>

    <input type="checkbox" name="chk1" value ="c1">
    <h3>Check</h3>
    <button>click</button>
    <script>
        document.getElementsByTagName("button")[0].onclick = function (){
            if(document.getElementsByTagName("input")[0].checked ==true) {
                document.getElementsByTagName("h3")[0].innerHTML="true";
            }
            else {
                document.getElementsByTagName("h3")[0].innerHTML="false";
            }
        }

    </script>
    <form action="#" method="get" name="f1">
      <fieldset>
        <legend>폼 요소1</legend>
        <p>
          <label for="user_pw1">비밀번호</label>
          <input type="password" name="user_pw1" id="user_pw1" />
        </p>
        <p>
          <label for="user_pw2">비밀번호 확인</label>
          <input type="text" name="user_pw2" id="user_pw2" />
          <input type="submit" value="확인" />
        </p>
      </fieldset>
    </form>
    <form action="#" method="get" name="f2">
      <fieldset>
        <legend>폼 요소2</legend>
        <div id="terms">
          회사는 법령이 정하는 바에 따라 "회원"의 개인정보를 보호하기
          위해 노력합니다. 개인정보의 보호 및 사용에 대해서는 관련법
          및 회사의 개인정보취급방침이 적용됩니다.
        </div>
        <p>
          <input type="checkbox" name="accept" id="accept" />
          <label for="accept">약관 동의합니다.</label></p>
        <p>
          <input type="checkbox" name="allChk" id="allChk" />
          <label for="allChk">전체선택</label><br />
          <input type="checkbox" name="subject1" id="subject1" value="s1" />
          <label for="subject1">과목1</label><br />
          <input type="checkbox" name="subject2" id="subject2" value="s2" />
          <label for="subject2">과목2</label><br />
          <input type="checkbox" name="subject3" id="subject3" value="s3" />
          <label for="subject3">과목3</label>
        </p>
        <p>
          <input type="submit" value="등록 완료" />
          <input type="reset" value="등록 취소" />
        </p>
      </fieldset>
    </form>
    <script>
        const form1 = document.getElementsByName("f1")[0];
        const form2 = document.getElementsByName("f2")[0];

        //Submit button
        form1.onsubmit=function() {
            const pw1 = document.getElementById("user_pw1");
            const pw2 = document.getElementById("user_pw2");
            pw2.value=pw1.value;
            pw2.diabled= true;
            return false;
        }
        document.getElementById("allChk").onclick=function() {
            document.getElementById("subject1").checked =this.checked;
            document.getElementById("subject2").checked =this.checked;
            document.getElementById("subject3").checked =this.checked;
        }
        form2.onsubmit =function () {
            const act = accept;
            if (!act.checked) {
                alert("약관 동의 필요");
                act.focus();
                return false;
            }
        }

    </script>


</body>
</html>
