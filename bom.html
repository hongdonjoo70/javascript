<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brouser object model</title>
</head>
<body>
    <button onclick="myfunction()">naver</button>
    <button onclick="myfunctionclose()">close</button>
    <script>
        let mywindow;
        function myfunction() {
            mywindow= window.open("https://www.naver.com","_blank","toolbar=yes,scrollbars=yes,resizable =yes,top=500,left=500,width=400,height=400");
        }
        function myfunctionclose() {
            mywindow.close();
        }
    </script>
    
</body>
</html>
