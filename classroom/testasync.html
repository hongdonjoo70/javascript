<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="myInput" type="text" placeholder="Search.." onkeyup="searchTable()">
    <div class="wrap"></div>
    <script>
        document.addEventListener("DOMContentLoaded",()=> {
            fetch ("./class.json")
                .then (response => {
                    //document.write(response);
                    if (!response.ok) 
                        throw new Error ("Error to load the data!!!");
                    return response.json();
                })
                .then (data => {
                    //document.write(data);
                    if (data.length >0) {
                        const table = document.createElement("table");
                        table.id = "dataTable"; 
                        data.forEach(item => {
                            const row =document.createElement ("tr");

                            //document.write(item["id"]+" "+item["name"]);
                            ["id","name","gender","addr"].forEach(key => {
                                const cell = document.createElement("td");
                                cell.textContent=item[key];
                                row.appendChild(cell);
                            });
                            table.appendChild(row);
                        });
                        document.querySelector(".wrap").appendChild(table);
                    }
                })
                .catch(error => {
                   // document.write("Error " +error);
                })

        })
        function searchTable() {
            const input = document.getElementById("myInput").value.toLowerCase();
            const rows = document.querySelectorAll("#dataTable tr");

            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(input) ? "" : "none";
            });
        }
    </script>
    <body>


</body>
</body>
</html>
