<!DOCTYPE html>
<html>

<body>

  <h2>JavaScript break label</h2>

  <p id="demo"></p>

  <script>
    var cars = ["BMW", "Volvo", "Saab", "Ford"];
    var text = "";

    abc: {
      text += cars[0] + "<br>";
      text += cars[1] + "<br>";
      break abc;
      text += cars[2] + "<br>";
      text += cars[3] + "<br>";
    }

    document.getElementById("demo").innerHTML = text;
  </script>

</body>

</html>
