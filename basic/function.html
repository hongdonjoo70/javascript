        function sumxx (){
            let result = arguments[0]+arguments[1] +arguments[2];
            return result;
        }

        // add variable parameter
        function sumn() {
            let result = 0;
            for ( let i=0; i < arguments.length; i++) {
                result += arguments[i];
            }
            return result;
        }
        let resultB = sumxx(10,20,30);

        document.write(`sum ${resultB} ${resultC} ${resultD} <br>`)

            }

        }
