<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("For <hr>")
        for (let index=1;index <10;index++){
            document.write("2*"+index+"="+index*2+"<br>");
        }
        document.write("While <hr>")
        {
            let index = 0;
            while (index <10){
                document.write("2*"+index+"="+index*2+"<br>")
                index++;
            }
        }
        document.write("Input number <hr>")
        let number = prompt("input number(1-9)");
        if (number > 1 && number < 10)
        {
            let index = 0;
            while (index <10){
                document.write(number+"*"+index+"="+index*number+"<br>");
                index++;
            }
        }
        else {
            document.location.reload();
        }
        document.write("Function Input number <hr>")
        function multiple(number) {
            if (number > 1 && number < 10)
            {
                let index = 0;
                while (index <10){
                    document.write(number+"*"+index+"="+index*number+"<br>");
                    index++;
                }
            }   
        }
        multiple(number);
        document.write("All multiple <hr>");
        for (let number =2; number < 10; number++){
            for (let number2 =1; number2<10; number2 ++) {
                document.write(number+"*"+number2+"="+number2*number+"<br>");
            }
            document.write("<br>");
        }

        lista = [1,2,3,4,45,5,6];
        min = lista[0];
        max = lista[0];
        sum = 0;
        for (let index=0;index<lista.length;index++) {
            if (min > lista[index]) {
                min = lista[index];
            }
            if (max < lista[index]) {
                max = lista[index];
            }
            sum += lista[index];
        }
        document.write("Max "+ max+"Min"+min+"Average" + sum/lista.length);
        document.write("<br>");
        let input = prompt("Input char");
        if (isNaN(Number(input))) {
            document.write("It is not number" + input);
        }
        else {
            document.write("It is number" + input);
            let age= Number(input);
            if (age >= 20) {
                document.write("Adult Age:" + age);
            }
            else {
                document.write("Not adult Age:" + age);
            }
        }
    </script>
</body>
</html>
