<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const obj = {
            name:"John",
            age:30,
            birth:"1986-12-14",
            city: "New York"
        }
        const myJson = JSON.stringify(obj);
        document.write("<br>"+obj+"<br>");
        document.write("<br>"+myJson+"<br>");
        const newObj = JSON.parse(myJson);
        document.write("<br>"+newObj+newObj["name"]+"<br>");
        const newObj2 = JSON.parse(myJson,function (key,value) {
            if (key =="birth") {
                return new Date(value);
            }
            else {
                return value;
            }
        });
        document.write("<br>"+newObj2+newObj2["birth"]+"<br>");
    
    </script>
    <h2>Create Object from JSON String</h2>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2">c</p>
    
    <script>
        const text = '{"class":[{"seong":"김","name":"유신","age":"21"},{"seong":"이","name":"순신","age":"22" },    {"seong":"홍","name":"길동","age":"23" }]}';
        const objn = JSON.parse(text);

        document.getElementById("demo").innerHTML=objn.class[0].seong + " " +objn.class[1].name;
        
        for(let element in objn.class) {
            document.getElementById("demo1").innerHTML += objn.class[element].seong + " " +objn.class[element].name + "<br>";
        }

        let tables = "<table border='1'>";
        for (let element in objn.class) {
            tables +="<tr>";
            tables += "<td>이름 </td><td>" + objn.class[element].seong + " "+objn.class[element].name+ "</td><td>이름</td><td>"+ objn.class[element].age +"</td></tr>";
        }
        tables +="</table>";
        document.getElementById("demo2").innerHTML = tables;


    </script>



</body>
</html>
