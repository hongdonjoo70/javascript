<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            table {
                border-collapse: collapse;
            }
        </style>


    </head>
    <body>
        <table border="1">
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
        </table>
        <script>
            a="1";
            b =2;
            document.write(a+b+b,"<br>");
            document.write(b+b+a+b+b,"<br>");
            a="학교종이";
            b="땡땡땡";
            c=8282;
            d="어서모이자";
            document.write(a+b+c+d);
            //문자열로 HMTL tag 작성
            var t ='<table border="1">';
            t += '<tr>';
            t += '<td>1</td> <td>2</td>    <td>3</td>';
            t+= '</tr>';
            t+= '</table>';
            document.write(t);
            var k=10, m="10";
            document.write(typeof k,"<br>");
            document.write(typeof m,"<br>");
            result = k>m;
            document.write(result,"<br>");
            result = k!=m;
            document.write(result,"<br>");

            
        </script>

    </body>
</html>
